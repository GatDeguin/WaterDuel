<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WaterDuel · inspección del cierre</title>
<style>body{margin:0;background:#10231e;color:#e7e9d9;font:14px system-ui}canvas{display:block;width:100%;aspect-ratio:16/9}section{padding:16px}button{min-height:44px;margin:4px;padding:10px;background:#304731;color:inherit;border:1px solid #b89b62}pre{white-space:pre-wrap;overflow-wrap:anywhere}p{max-width:900px;line-height:1.5}</style>
<canvas id="scene" aria-label="Inspección del taller, materiales y trofeo"></canvas><section><h1>Inspección del cierre de WaterDuel</h1>
<p>Escenas de inspección con el renderer real. Los trofeos son vistas ilustrativas: no acreditan una victoria de campaña ni escriben progreso. Sin conexión a mandos o sesiones LAN.</p>
<p id="status" role="status">Preparando recursos…</p><button id="ready">Taller y personajes</button><button id="normal">Trofeo del Campeón</button><button id="advanced">Trofeo del Maestro</button><button id="detail">Detalle de materiales</button><button id="neutral">Alternar luz neutra</button>
<details><summary>Evidencia de inspección</summary><pre id="receipt"></pre></details></section>
<script type="module">
import {HostSession} from '../host-session.js';
import {Renderer3D} from '../render3d.js';
import {STEP} from '../engine.js';
const $=id=>document.getElementById(id),host=new HostSession({opponentSeed:113}),renderer=new Renderer3D($('scene'));
let preview='ready',detail=false,neutral=false,last=performance.now(),accumulator=0,frames=0,closed=false;
for(const id of ['ready','normal','advanced'])$(id).addEventListener('click',()=>{preview=id;detail=false;});
$('detail').addEventListener('click',()=>{preview='ready';detail=!detail;});$('neutral').addEventListener('click',()=>{neutral=!neutral;});
renderer.loadAssets(status=>{$('status').textContent=`Recursos ${status.ready}/${status.total} · ${status.loading?'cargando':'listos'}${status.errors.length?' · '+status.errors.join(' '):''}`;}).catch(error=>{$('status').textContent=String(error.message);});
function animate(now){
 if(closed)return;requestAnimationFrame(animate);accumulator+=Math.min(.06,Math.max(0,(now-last)/1000));last=now;
 let steps=0;while(accumulator>=STEP&&steps++<8){host.update(STEP);accumulator-=STEP;}if(steps>=8)accumulator=0;
 const original=host.renderState(),scene={...original.scene,cameraMode:detail?'detail':'combat',lightingMode:neutral?'neutral':'cinematic'};
 if(preview!=='ready'){scene.phase='matchover';scene.phaseClock=3.26;scene.ceremony={tier:preview,trophy:preview==='normal'?'champion':'master',age:2};}
 renderer.render(scene,original.time);
 if(++frames%10===0)$('receipt').textContent=JSON.stringify({scope:'Staged visual inspection; no campaign win or FPS claim',preview,detail,neutral,assets:renderer.assetStatus,camera:renderer.stats.camera,loadouts:host.game.loadouts,models:Object.keys(renderer.assetScene.characters??{}),errors:renderer.stats.error??null},null,2);
}
requestAnimationFrame(animate);addEventListener('pagehide',()=>{closed=true;renderer.dispose();});
</script></html>
